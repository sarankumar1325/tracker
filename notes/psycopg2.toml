[[note]]
platforms = ["linux-x86_64", "linux-aarch64", "musl-x86_64", "musl-aarch64", "macos-x86_64", "macos-arm64"]
kind = "alternative"
text = "psycopg2 has wheels for Windows x86-64 only. psycopg2-binary has wheels for these platforms (not for free-threaded Python): `pip install psycopg2-binary`. The psycopg docs say it is meant for beginners and advise building psycopg2 from source for production. On Psycopg 3, `pip install \"psycopg[binary]\"` is the equivalent."
links = ["https://www.psycopg.org/docs/install.html#psycopg-vs-psycopg-binary", "https://www.psycopg.org/psycopg3/docs/basic/install.html#binary-installation", "https://pypi.org/project/psycopg2-binary/#files"]
updated = 2026-11-11
