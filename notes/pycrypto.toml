kind = "alternative"
text = "pycrypto has had no release since 2.6.1 and ships an sdist only. PyCryptodome has wheels here and installs under the same `Crypto` package: `pip uninstall pycrypto`, then `pip install pycryptodome`. Its docs warn against having both installed at once."
links = ["https://www.pycryptodome.org/src/installation", "https://pypi.org/project/pycryptodome/#files"]
